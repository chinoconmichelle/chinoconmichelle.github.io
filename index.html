<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chino con Michelle</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-theme="light">
<div class="wrap">

  <div class="topbar">
    <div class="seg" id="langSeg">
      <button data-lang="es">Español</button>
      <button data-lang="en">English</button>
      <button data-lang="zh">中文</button>
    </div>
    <div class="seg" id="themeSeg">
      <button data-theme="light" data-i18n="light"></button>
      <button data-theme="sepia" data-i18n="sepia"></button>
      <button data-theme="dark" data-i18n="dark"></button>
    </div>
    <div class="seg">
      <button id="fontDown" aria-label="A-">A−</button>
      <button id="fontUp" aria-label="A+">A＋</button>
    </div>
  </div>

  <!-- HOME -->
  <section id="homeView">
    <header>
      <h1 data-i18n="appTitle"></h1>
      <p data-i18n="appSub"></p>
    </header>
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <button class="ghost" id="exportBtn" data-i18n="export"></button>
      <button class="ghost" id="importBtn" data-i18n="import"></button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    </div>
    <div class="note" data-i18n="storageNote"></div>
  </section>

  <!-- STUDY -->
  <section id="studyView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="homeBtn" data-i18n="back"></button>
      <h2 id="topicTitle"></h2>
    </div>
    <div class="opts">
      <button id="mode1" data-i18n="mode1"></button>
      <button id="mode2" data-i18n="mode2"></button>
      <button id="pinyinBtn" data-i18n="pinyin"></button>
      <button id="shuffleBtn" data-i18n="shuffle"></button>
    </div>
    <div class="countbar">
      <span><span data-i18n="remaining"></span>: <b id="count">0</b></span>
      <button class="ghost" id="viewKnownBtn" data-i18n="viewKnown" style="font-size:.8rem;padding:6px 10px"></button>
    </div>

    <div id="cardArea">
      <div class="card" id="card" role="button" tabindex="0">
        <div class="card-inner">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="hint" data-i18n="hint"></div>
      <details class="explain hidden" id="explain" open>
        <summary data-i18n="understand"></summary>
        <div id="explainText"></div>
      </details>
      <div class="row">
        <button id="speakBtn" data-i18n="hear"></button>
      </div>
      <div class="row">
        <button id="prevBtn" data-i18n="prev"></button>
        <button id="nextBtn" data-i18n="next"></button>
      </div>
      <div class="row">
        <button class="unknown" id="unknownBtn" data-i18n="notYet"></button>
        <button class="known" id="knownBtn" data-i18n="gotIt"></button>
      </div>
    </div>
    <div class="donebox hidden" id="doneBox" data-i18n="allDone"></div>
    <div class="subrow">
      <button class="ghost" id="restartBtn" data-i18n="restart"></button>
      <button class="ghost" id="resetBtn" data-i18n="resetTopic"></button>
    </div>
    <div class="keys" data-i18n="keys"></div>
  </section>

  <!-- KNOWN LIST -->
  <section id="knownView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="backToStudy" data-i18n="backStudy"></button>
      <h2><span data-i18n="knownTitle"></span> (<span id="knownCount">0</span>)</h2>
    </div>
    <div id="knownList"></div>
  </section>
</div>

<script src="data/topics.js"></script>
<script src="data/saludos.js"></script>
<script src="data/pronombres.js"></script>
<script src="data/vocab22.js"></script>
<script src="data/numeros.js"></script>
<script src="data/familia.js"></script>
<script src="data/clasif.js"></script>
<script src="data/genero.js"></script>
<script src="data/frases.js"></script>
<script src="data/radicales.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
