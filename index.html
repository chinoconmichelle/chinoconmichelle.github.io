<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chino con Michelle</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-theme="dark">
<div class="wrap">

  <div class="topbar">
    <div class="seg" id="langSeg">
      <button data-lang="es">Español</button>
      <button data-lang="en">English</button>
      <button data-lang="zh">中文</button>
    </div>
    <div class="seg" id="themeSeg">
      <button data-theme="light" data-i18n="light"></button>
      <button data-theme="sepia" data-i18n="sepia"></button>
      <button data-theme="dark" data-i18n="dark"></button>
    </div>
    <div class="seg">
      <button id="fontDown" aria-label="A-">A−</button>
      <button id="fontUp" aria-label="A+">A＋</button>
    </div>
  </div>

  <!-- SIGN IN -->
  <section id="authView" class="hidden">
    <form class="authbox" id="authForm" autocomplete="on" data-mode="in">
      <div class="authglyph">中</div>
      <h1 data-i18n="authTitle"></h1>
      <p data-i18n="authSub"></p>
      <div class="authtabs">
        <button type="button" data-mode="in" data-i18n="signIn"></button>
        <button type="button" data-mode="up" data-i18n="signUp"></button>
      </div>
      <p class="resetintro only-reset" data-i18n="resetIntro"></p>
      <label><span data-i18n="username"></span>
        <input id="authUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30">
      </label>
      <label><span class="not-reset" data-i18n="password"></span><span class="only-reset" data-i18n="newPassword"></span>
        <span class="pw"><input id="authPass" name="password" type="password" autocomplete="current-password">
        <button type="button" class="eye" id="eyeBtn" data-i18n="show"></button></span>
      </label>
      <label class="only-new"><span data-i18n="password2"></span>
        <span class="pw"><input id="authPass2" name="confirm-password" type="password" autocomplete="new-password">
        <button type="button" class="eye" id="eyeBtn2" data-i18n="show"></button></span>
      </label>
      <div class="pwmatch only-new" id="pwMatch" aria-live="polite"></div>
      <div class="autherr" id="authErr" role="alert"></div>
      <div class="authok" id="authOk" role="status"></div>
      <button type="submit" class="on" id="authSubmit"></button>
      <button type="button" class="linkbtn only-in" id="forgotBtn" data-i18n="forgot"></button>
      <button type="button" class="linkbtn only-reset" id="backInBtn" data-i18n="backToSignIn"></button>
    </form>
  </section>

  <!-- HOME -->
  <section id="homeView" class="hidden">
    <div class="account">
      <span id="helloUser"></span>
      <span class="sync" id="syncStatus"></span>
      <button class="ghost" id="signOutBtn" data-i18n="signOut"></button>
    </div>
    <header>
      <h1 data-i18n="appTitle"></h1>
      <p data-i18n="appSub"></p>
    </header>
    <input class="search" id="searchBox" type="search" autocomplete="off" spellcheck="false">
    <div class="searchresults hidden" id="searchResults"></div>
    <div class="seg homeby" id="homeBySeg">
      <button data-by="topic" data-i18n="byTopic"></button>
      <button data-by="class" data-i18n="byClass"></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="note" data-i18n="storageNote"></div>
  </section>

  <!-- STUDY -->
  <section id="studyView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="homeBtn" data-i18n="back"></button>
      <h2 id="topicTitle"></h2>
    </div>
    <div class="opts">
      <button id="mode1" data-i18n="mode1"></button>
      <button id="mode2" data-i18n="mode2"></button>
      <button id="pinyinBtn" data-i18n="pinyin"></button>
      <button id="shuffleBtn" data-i18n="shuffle"></button>
      <button id="quizBtn" data-i18n="quiz"></button>
    </div>
    <div class="countbar">
      <span><span data-i18n="remaining"></span>: <b id="count">0</b></span>
      <button class="ghost" id="viewKnownBtn" data-i18n="viewKnown" style="font-size:.8rem;padding:6px 10px"></button>
    </div>

    <div id="cardArea">
      <div class="card" id="card" role="button" tabindex="0">
        <div class="card-inner">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="hint"><span data-i18n="hint"></span> <span class="cltag" id="clTag"></span></div>
      <details class="explain hidden" id="explain" open>
        <summary data-i18n="understand"></summary>
        <div id="explainText"></div>
      </details>
      <div class="row">
        <button id="speakBtn" data-i18n="hear"></button>
      </div>
      <div class="row">
        <button id="prevBtn" data-i18n="prev"></button>
        <button id="nextBtn" data-i18n="next"></button>
      </div>
      <div class="row">
        <button class="unknown" id="unknownBtn" data-i18n="notYet"></button>
        <button class="known" id="knownBtn" data-i18n="gotIt"></button>
      </div>
    </div>
    <div class="donebox hidden" id="doneBox" data-i18n="allDone"></div>
    <div class="subrow">
      <button class="ghost" id="restartBtn" data-i18n="restart"></button>
      <button class="ghost" id="resetBtn" data-i18n="resetTopic"></button>
    </div>
    <div class="keys" data-i18n="keys"></div>
  </section>

  <!-- KNOWN LIST -->
  <section id="knownView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="backToStudy" data-i18n="backStudy"></button>
      <h2><span data-i18n="knownTitle"></span> (<span id="knownCount">0</span>)</h2>
    </div>
    <div id="knownList"></div>
  </section>

  <!-- TONES & SOUNDS -->
  <section id="tonesView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="tonesHome" data-i18n="back"></button>
      <h2 data-i18n="tonesTitle"></h2>
    </div>
    <div id="tonesBody"></div>
  </section>

  <!-- LISTENING QUIZ -->
  <section id="quizView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="quizBack" data-i18n="backTopic"></button>
      <h2><span data-i18n="quizTitle"></span> · <span id="quizTopic"></span></h2>
    </div>
    <div class="countbar"><span data-i18n="quizQ"></span><b id="quizScore"></b></div>
    <div class="row"><button id="quizReplay" class="on" data-i18n="replay"></button></div>
    <div class="qopts" id="quizOpts"></div>
    <div class="qreveal" id="quizReveal"></div>
    <div class="row"><button id="quizNext" class="hidden" data-i18n="nextQ"></button></div>
  </section>

  <!-- NUMBER DRILL -->
  <section id="drillView" class="hidden">
    <div class="studyhead">
      <button class="ghost" id="drillHome" data-i18n="back"></button>
      <h2 data-i18n="drillTitle"></h2>
    </div>
    <div class="opts" id="drillRange">
      <button data-r="0-10">0–10</button>
      <button data-r="0-20">0–20</button>
      <button data-r="0-100">0–100</button>
      <button data-r="100-200">100–200</button>
      <button data-r="0-999">0–999</button>
    </div>
    <div class="opts">
      <button id="dmode1" data-i18n="dmode1"></button>
      <button id="dmode2" data-i18n="dmode2"></button>
      <button id="dorder" data-i18n="dorder"></button>
      <button id="dpinyin" data-i18n="pinyin"></button>
    </div>
    <div class="card" id="dcard" role="button" tabindex="0">
      <div class="card-inner">
        <div class="face front" id="dfront"></div>
        <div class="face back" id="dback"></div>
      </div>
    </div>
    <div class="hint" data-i18n="hint"></div>
    <details class="explain hidden" id="dexplain" open>
      <summary data-i18n="howBuilt"></summary>
      <div id="dexplainText"></div>
    </details>
    <div class="row"><button id="dspeak" data-i18n="hear"></button></div>
    <div class="row">
      <button id="dprev" data-i18n="prev"></button>
      <button id="dnext" data-i18n="next"></button>
    </div>
    <div class="keys" data-i18n="dkeys"></div>
  </section>
</div>

<script src="assets/supabase.min.js"></script>
<script src="data/topics.js"></script>
<script src="data/saludos.js"></script>
<script src="data/pronombres.js"></script>
<script src="data/vocab22.js"></script>
<script src="data/numeros.js"></script>
<script src="data/familia.js"></script>
<script src="data/familia2.js"></script>
<script src="data/clasif.js"></script>
<script src="data/genero.js"></script>
<script src="data/frases.js"></script>
<script src="data/radicales.js"></script>
<script src="assets/app.js"></script>
<script src="assets/extras.js"></script>
</body>
</html>
